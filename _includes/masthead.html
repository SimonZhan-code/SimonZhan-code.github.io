{% include base_path %}

<div class="masthead">
  <header class="site-header">
    <a class="site-header__name" href="{{ base_path }}/">{{ site.title }}</a>
    <nav class="site-header__nav">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} class="active"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </header>
</div>
